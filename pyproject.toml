[project]
name = "pdf-statement-processor"
version = "0.1.0"
description = "PDF bank statement processor using pdfplumber and pandas"
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.66.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false